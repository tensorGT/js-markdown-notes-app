<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Note Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-top">
        <h1>My Notes</h1>
        <button type="button" id="new-note-btn">+ New</button>
      </div>

      <input type="search" id="note-search" placeholder="Search notes...">
      <select id="tag-filter" aria-label="Filter by tag">
        <option value="all">All tags</option>
      </select>

      <ul id="note-list" class="note-list"></ul>
    </aside>

    <main class="workspace">
      <header class="toolbar">
        <input type="text" id="note-title" placeholder="Note title">
        <input type="text" id="note-tag" placeholder="Tag (eg: study)">
        <button type="button" id="export-md-btn">Export .md</button>
        <button type="button" id="export-html-btn">Export .html</button>
        <button type="button" id="delete-note-btn" class="danger">Delete</button>
      </header>
